[workspace]
members = [
    "examples",
    "webrender",
    "webrender_api",
    "wrench",
    "example-compositor/compositor",
]

[profile.release]
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

# optimizing glsl more makes a big difference in swgl build times
[profile.dev.package.glsl]
opt-level = 2

[profile.release.package.glsl]
opt-level = 2

[patch.crates-io]
fog = { path = "fog" }
glutin = { git = "https://gitlab.redox-os.org/redox-os/glutin.git", branch = "redox-0.29" }
osmesa-sys = { git = "https://gitlab.redox-os.org/redox-os/osmesa-rs.git", branch = "redox" }
winit = { git = "https://gitlab.redox-os.org/redox-os/winit.git", branch = "redox-0.27" }
